# CI/CD for the CraigsNotice monorepo.
#
# The Docker image is built from the repo root because craigsnotice_api depends
# on @craigsnotice/types through a workspace link — the build context has to
# contain the workspace root.
#
# The API's tests are integration tests against a real database. Rather than
# add a service container to the shared workflow that ~118 other repos also
# call, `bun run test` starts the runner's preinstalled PostgreSQL itself via
# scripts/ensure-test-db.sh. Nothing outside this repo has to change.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    with:
      docker-image-name: "craigsnotice_api"
      skip-npm-publish: true # workspace packages, nothing published
    secrets: inherit
